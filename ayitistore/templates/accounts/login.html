{% extends 'base.html' %}
{% block title %}Connexion — AyitiStore{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center" style="background:var(--grad-hero);padding:2rem 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a href="{% url 'store:home' %}" style="font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;color:white;">
            Ayiti<span style="color:var(--gold);">Store</span>
          </a>
        </div>
        <div class="bg-white rounded-ayiti shadow-ayiti p-5">
          <h3 style="font-family:'Playfair Display',serif;margin-bottom:1.5rem;text-align:center;">Connexion</h3>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label-ayiti">Nom d'utilisateur</label>
              <input type="text" name="username" class="form-ayiti" required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label-ayiti">Mot de passe</label>
              <input type="password" name="password" class="form-ayiti" required>
            </div>
            <button type="submit" class="btn-primary-ayiti w-100 justify-content-center" style="font-size:1rem;padding:0.9rem;">
              Se connecter
            </button>
          </form>
          <hr class="my-4">
          <p class="text-center text-muted small mb-0">
            Pas encore de compte? <a href="{% url 'accounts:register' %}" class="text-haiti-blue fw-bold">S'inscrire</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
